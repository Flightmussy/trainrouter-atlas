# Sync the Kaggle and Hugging Face mirrors from this repo.
#
# Runs when a GitHub release is published (which is also what makes Zenodo
# mint a new DOI) — so one release = DOI + both mirrors. Can also be run by
# hand from the Actions tab (workflow_dispatch).
#
# INERT until two secrets exist (Settings → Secrets and variables → Actions):
#   KAGGLE_API_TOKEN   from kaggle.com/settings/api → "Generate New Token"
#                      (the new KGAT_… tokens; identity is embedded, no username)
#   HF_TOKEN           from huggingface.co/settings/tokens (write scope)
# Each job skips itself politely when its secret is missing.
#
# The two mirrors are NOT symmetrical: Hugging Face gets all three files,
# Kaggle gets the two fact files only. See the comment in the kaggle job.
#
# NOTE: until 2026-08-24 the kaggle job carried the id
# 'albanius/world-train-routes-trainrouter-atlas'. No such Kaggle account
# exists, so this job could never have created the dataset it claimed to
# mirror, and the README advertised that dead link for six weeks.

name: Sync mirrors

on:
  release:
    types: [published]
  workflow_dispatch:

# Both jobs hold an API token, so the actions are pinned to commits and the
# packages to exact versions (bump them deliberately), and the workflow token
# is read only.
permissions:
  contents: read

jobs:
  kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Push a new Kaggle dataset version
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "No KAGGLE_API_TOKEN secret — skipping Kaggle sync."; exit 0; fi
          pip -q install 'kaggle==2.2.5' 'six==1.17.0'  # pinned: this job holds KAGGLE_API_TOKEN; kaggle 2.2.5 imports six without declaring it
          # Facts only. routes.geojson is deliberately NOT mirrored here:
          # some of its lines are traced from OpenStreetMap and are therefore
          # ODbL, and Kaggle allows a dataset only ONE licence label, so
          # shipping the geometry under CC-BY-4.0 would misstate it. The
          # geometry lives on GitHub, where the split licence can be spelled
          # out. routes.csv and routes.json carry no geometry at all.
          mkdir -p ds && cp data/routes.csv data/routes.json ds/
          cat > ds/dataset-metadata.json <<'META'
          {
            "id": "flightmussy/world-train-routes",
            "title": "World Train Routes",
            "licenses": [{ "name": "CC-BY-4.0" }]
          }
          META
          set +e
          OUT=$(kaggle datasets version -p ds -m "Sync from GitHub ${GITHUB_REF_NAME:-manual}" 2>&1)
          set -e
          echo "$OUT"
          # First run on a fresh slug: bootstrap the dataset (public) instead.
          # (Kaggle answers 403 Forbidden — not 404 — for missing/deleted slugs.)
          if echo "$OUT" | grep -qiE "not found|404|403|forbidden"; then
            echo "Dataset not found — creating it (public)."
            OUT=$(kaggle datasets create -p ds -u 2>&1)
            echo "$OUT"
          fi
          # The kaggle CLI exits 0 even on server-side errors — fail loudly.
          # ("Error while trying to load upload info" is a known benign CLI
          #  warning on newer server responses; uploads still succeed.)
          if echo "$OUT" | grep -vi "load upload info" | grep -qi "error"; then
            echo "::error::Kaggle push failed (see output above)"
            exit 1
          fi

  huggingface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Push files to the Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "No HF_TOKEN secret — skipping Hugging Face sync."; exit 0; fi
          pip -q install 'huggingface_hub==2.4.0'  # pinned: this job holds HF_TOKEN
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          msg = f"Sync from GitHub {os.environ.get('GITHUB_REF_NAME', 'manual')}"
          for name in ["routes.csv", "routes.json", "routes.geojson"]:
              api.upload_file(
                  path_or_fileobj=f"data/{name}",
                  path_in_repo=name,
                  repo_id="Flightmussy/trainrouter-atlas",
                  repo_type="dataset",
                  commit_message=msg,
              )
          print("uploaded 3 files:", msg)
          EOF
